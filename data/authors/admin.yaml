bio: |
  Hi, I'm a Schmidt / AI postdoctoral fellow with a joint appointment at
  Caltech and Fermilab. I work on the [CMS](https://cms.cern) experiment
  at the CERN Large Hadron Collider on expanding our discovery potential
  in particle physics with AI.

  I completed my PhD at UC San Diego, where I worked on
  [deep generative models for particle physics simulations](/projects/fast-sim/),
  [searches for highly energetic Higgs boson pairs](/projects/higgs) using
  AI, [equivariant neural networks](/projects/equivariant-networks/) for
  model-independent searches, and [more](/projects/).

