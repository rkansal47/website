experience:
  - role: Schmidt AI Fellow
    org: Caltech + Fermilab
    start: 2024-09-01
    summary: |
      * High energy Higgs measurements
      * Real-time AI
      * Model-independent searches
  - role: Graduate Researcher in Particle Physics + AI
    org: CMS Group / Duarte Lab, UC San Diego
    start: 2019-09-01
    end: 2024-06-18
    summary: |
      * Developed new graph- and attention-based generative models for
        sparse and irregular data like that prevalent in particle physics
      * Lorentz-group equivariant graph neural network (GNN) autoencoders
        for compression and anomaly detection, machine learning for
        particle flow reconstruction, JetNet library for convenience and
        reproducibility in machine learning development in high energy
        physics
      * Developed and applied GNN classifiers to set the most stringent
        constraints to date on double-Higgs production, allowing insight
        into the metastability of the universe
  - role: CERN Openlab Intern
    org: Machine Learning for Particle Physics Group, CERN
    start: 2019-06-01
    end: 2019-08-01
    summary: |
      * Started our project on graph generative models for particle
        physics simulations, motivated primarily by the CMS experiment's
        new High Granularity Calorimeter (HGCAL)
  - role: Experimental Quantum Information Science Researcher
    org: Barreiro Lab, UC San Diego
    start: 2017-06-01
    end: 2019-06-01
    summary: |
      * Designed and implemented a setup for a quantum gas microscope
        (QGM) to image with single-site resolution
      * Generated 2D dynamic, arbitrarily arranged, sub-micron optical
        tweezers, integrated with the QGM, via two methods, using:
        1) a Digital Micromirror Device (i.e. holography), and 2) an
        acousto-optic deflector
      * Characterized a high (0.8) Numerical Aperture objective for the
        QGM using OSLO optical simulations and point-spread function
        image analysis in Python
      * Using an FPGA device, outputted RF waveforms that modulate laser
        beams with parabolic spatial intensity in order to produce a
        Bose-Einstein Condensate
      * Programmed FPGA and C electronic devices, and created and (3D)
        printed mechanical mounts and electronics circuits for
        experimental use
  - role: Neurophysics Researcher
    org: Kleinfeld Lab, UC San Diego
    start: 2018-09-01
    end: 2019-06-01
    summary: |
      * Used two-photon microscopy to measure pO2 in the mouse
        somatosensory cortex
      * Imaged the cortex to measure vasomotion relative to pO2
  - role: Software Intern
    org: Focus Analytics
    start: 2016-07-01
    end: 2016-09-01
    summary: |
      * Interned at a software startup which has since been bought by Moka
      * Developed and deployed a location prediction SparkJava server
        with Cassandra and Redis databases
      * Implemented ML k-means clustering and SVM linear classification
        algorithms on location data

